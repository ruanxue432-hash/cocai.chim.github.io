<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Web khịa + nút bấm</title>
    <style>
        body {
            background: #0b0b0b;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
            text-align: center;
        }
        .card {
            background: #1c1c1e;
            padding: 40px 30px;
            border-radius: 40px;
            max-width: 500px;
            border: 2px solid #ff4757;
            box-shadow: 0 0 40px rgba(255, 71, 87, 0.2);
        }
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 10px;
        }
        .sub {
            font-size: 18px;
            color: #ffa502;
            margin: 15px 0;
        }
        .quote {
            font-size: 20px;
            background: #2a2a2c;
            padding: 20px;
            border-radius: 20px;
            border-left: 5px solid #ffa502;
            font-style: italic;
            color: #ddd;
        }
        .khia {
            color: #2ed573;
            font-weight: bold;
            font-size: 22px;
            margin-top: 20px;
        }
        .tag {
            color: #888;
            font-size: 14px;
            margin-top: 25px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
        /* ----- NÚT BẤM TO ĐÙNG ----- */
        .btn-tiktok {
            display: inline-block;
            margin-top: 25px;
            background: #ff0050;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            padding: 18px 40px;
            border-radius: 60px;
            text-decoration: none;
            box-shadow: 0 0 30px rgba(255, 0, 80, 0.5);
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }
        .btn-tiktok:hover {
            background: #ff3366;
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 0, 80, 0.8);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">🎮 ĐẾN FF MÀ KHỊA</div>
        <div class="sub">"Bọn con trai chúng tao..."</div>
        <div class="quote">
            “Thua thì bảo mạng lag, chơi bẩn.<br>
            Thắng thì khịa cả làng.<br>
            Con gái chúng mày giỏi thật đấy 🤡”
        </div>
        <div class="khia">
            👉 Còn bọn con trai thì vẫn cứ <br> “GÀ MẸ” mà solo tiếp thôi 😎
        </div>

        <!-- NÚT BẤM DẪN LINK TIKTOK -->
        <a href="https://vt.tiktok.com/ZS4WoBGMJ/" target="_blank">
            <button class="btn-tiktok">🎬 Bấm vào đây để xem TikTok</button>
        </a>

        <div class="tag">
            #FF #gàmẹ #lag #khịa #tuất
        </div>
    </div>
</body>
</html>
