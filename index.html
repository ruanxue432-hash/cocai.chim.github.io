<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TikTok Live Simulator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 20px; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        input, button { padding: 8px 12px; margin: 5px; border-radius: 4px; border: none; }
        input { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        button { background: #fe2c55; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #e0264b; }
        .stream-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .card { background: #252525; border-radius: 8px; padding: 12px; position: relative; border: 1px solid #3d3d3d; }
        .chest { background: #ffd700; color: #000; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; margin-top: 5px; }
        .req { color: #ff4d4d; font-size: 11px; margin-top: 4px; }
        .blocked { border: 1px solid #ff4d4d; opacity: 0.4; }
    </style>
</head>
<body>

    <h2>TikTok Live Chest Filter</h2>

    <div class="box">
        <h3>1. Cấu hình hòm xu live của mày</h3>
        Số xu trong hòm: <input type="number" id="myCoins" value="500">
        <button onclick="updateMyStream()">Cập nhật Live của tao</button>
        <div id="myStreamDisplay" style="margin-top:10px;"></div>
    </div>

    <div class="box">
        <h3>2. Bộ lọc danh sách Live khác</h3>
        <label>
            <input type="checkbox" id="blockPayToWin" onchange="renderStreams()"> 
            <b>Chặn Live bắt tặng xu mới được mở hòm (Phí > 0)</b>
        </label>
    </div>

    <h3>Danh sách các Live đang phát:</h3>
    <div class="stream-grid" id="streamContainer"></div>

    <script>
        // Data giả lập danh sách các phòng live
        const streams = [
            { id: 1, user: "Kênh Chill Studio", coins: 100, entryFee: 0 },
            { id: 2, user: "Săn Xu Giá Rẻ", coins: 50, entryFee: 10 },
            { id: 3, user: "Idol Stream Game", coins: 1000, entryFee: 0 },
            { id: 4, user: "Hòm Xu Hút Máu", coins: 500, entryFee: 50 },
            { id: 5, user: "Giao Lưu Đêm Khuya", coins: 0, entryFee: 0 }
        ];

        function updateMyStream() {
            const coins = document.getElementById("myCoins").value;
            const display = document.getElementById("myStreamDisplay");
            display.innerHTML = `
                <div class="card" style="border: 1px solid #fe2c55;">
                    <strong>Phòng Live Của Mày</strong><br>
                    ${coins > 0 ? `<span class="chest">🎁 Hòm: ${coins} Xu</span>` : '<i>Không có hòm xu</i>'}
                </div>
            `;
        }

        function renderStreams() {
            const container = document.getElementById("streamContainer");
            const isBlockEnabled = document.getElementById("blockPayToWin").checked;
            container.innerHTML = "";

            streams.forEach(stream => {
                const isBlocked = isBlockEnabled && stream.coins > 0 && stream.entryFee > 0;

                if (isBlocked) return; // Chặn không hiển thị

                const card = document.createElement("div");
                card.className = "card";
                
                let content = `<strong>${stream.user}</strong><br>`;
                if (stream.coins > 0) {
                    content += `<span class="chest">🎁 Hòm: ${stream.coins} Xu</span><br>`;
                    if (stream.entryFee > 0) {
                        content += `<div class="req">⚠️ Bắt tặng ${stream.entryFee} xu để vào</div>`;
                    } else {
                        content += `<div style="color:#00ff88; font-size:11px;">Mở miễn phí</div>`;
                    }
                } else {
                    content += `<span style="color:#888; font-size:12px;">Không hòm</span>`;
                }

                card.innerHTML = content;
                container.appendChild(card);
            });
        }

        // Chạy lần đầu
        updateMyStream();
        renderStreams();
    </script>
</body>
</html>
