<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Link APK / ZIP Telegram</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 500px; text-align: center; border: 1px solid #334155; }
        h2 { margin-bottom: 20px; color: #38bdf8; font-size: 22px; }
        input { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 15px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        #status { margin-top: 15px; font-size: 14px; word-break: break-all; }
        .download-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #22c55e; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .download-btn:hover { background: #16a34a; }
        .error { color: #ef4444; }
        .success { color: #4ade80; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Get Link APK / ZIP Telegram</h2>
        <input type="text" id="tgUrl" placeholder="Dán link Telegram vào đây...">
        <button id="btnGet" onclick="getFile()">Bắt đầu get file</button>
        
        <div id="status"></div>
    </div>

    <script>
        async function getFile() {
            const urlInput = document.getElementById('tgUrl').value.trim();
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('btnGet');

            if (!urlInput) {
                statusDiv.innerHTML = '<span class="error">Đán cái link vào đã ông ơi!</span>';
                return;
            }

            statusDiv.innerHTML = '<span>Đang kéo file về server, chờ tí... (file nặng thì hơi lâu đấy)</span>';
            btn.disabled = true;
            btn.style.opacity = '0.6';

            try {
                // Gọi tới API Python Backend
                const response = await fetch(`/get-file?tg_url=${encodeURIComponent(urlInput)}`, {
                    method: 'POST'
                });
                
                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    statusDiv.innerHTML = `
                        <p class="success"><b>Kéo thành công!</b></p>
                        <p>Tệp: <b>${data.file_name}</b></p>
                        <a class="download-btn" href="${data.download_url}" download>Tải về máy ngay</a>
                    `;
                } else {
                    statusDiv.innerHTML = `<span class="error">Lỗi: ${data.detail || 'Không lấy được file!'}</span>`;
                }
            } catch (err) {
                statusDiv.innerHTML = '<span class="error">Không kết nối được với Server Backend!</span>';
            } finally {
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }
    </script>

</body>
</html>
