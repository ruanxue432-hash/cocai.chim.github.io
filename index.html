<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web trung gian - Quản trị TikTok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0b1a;
            background-image: radial-gradient(ellipse at 20% 50%, #1a1a3e 0%, #0b0b1a 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 40px 32px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
        }
        h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 8px;
        }
        h1 span {
            background: linear-gradient(135deg, #ff0050, #00f2ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 24px;
            font-size: 14px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 20px;
            border-radius: 16px;
            margin-bottom: 24px;
        }
        .status-bar .left {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online {
            background: #4caf50;
        }
        .dot.offline {
            background: #ff5252;
        }
        .dot.syncing {
            background: #ffc107;
            animation: pulse 0.8s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            color: #fff;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff0050, #d4006e);
        }
        .btn-primary:hover {
            transform: scale(1.05);
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .btn-success {
            background: #4caf50;
        }
        .btn-success:hover {
            background: #43a047;
        }
        .btn-warning {
            background: #ff9800;
        }
        .btn-warning:hover {
            background: #f57c00;
        }
        .btn-danger {
            background: #f44336;
        }
        .btn-danger:hover {
            background: #d32f2f;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .auth-box {
            max-width: 400px;
            margin: 40px auto;
        }
        .auth-box input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
        }
        .auth-box input:focus {
            border-color: #ff0050;
        }
        .auth-box .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
        }
        .auth-error {
            color: #ff6b6b;
            font-size: 14px;
            min-height: 24px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 8px;
        }
        .tab {
            padding: 10px 20px;
            border-radius: 30px;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .tab:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        .user-table th,
        .user-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .user-table th {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .user-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .role-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .role-badge.admin {
            background: #f5576c;
            color: #fff;
        }
        .role-badge.user {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.6);
        }
        .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Message */
        .message-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 3px solid transparent;
        }
        .message-item.unread {
            border-left-color: #ff0050;
            background: rgba(255, 0, 80, 0.06);
        }
        .message-item .msg-header {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 4px;
        }
        .message-item .msg-content {
            color: #fff;
        }
        .message-item .msg-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }
        .compose-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }
        .compose-form select,
        .compose-form textarea,
        .compose-form input {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .compose-form select option {
            background: #1e1e2f;
        }
        .compose-form textarea {
            min-height: 80px;
            resize: vertical;
        }
        .compose-form .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.6);
        }
        .compose-form .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: #ff0050;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
        }
        .hidden {
            display: none !important;
        }
        .footer-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .debug-info {
            background: rgba(255, 0, 80, 0.08);
            border-left: 3px solid #ff0050;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            display: none;
            word-break: break-all;
        }
        .debug-info.show {
            display: block;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px 16px;
            }
            .status-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .tabs {
                flex-wrap: wrap;
            }
            .tab {
                flex: 1;
                text-align: center;
                padding: 8px 12px;
                font-size: 13px;
            }
            .user-table th,
            .user-table td {
                padding: 8px 10px;
                font-size: 13px;
            }
            .actions-cell {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">

        <h1>🎵 <span>Web trung gian</span></h1>
        <div class="sub">Quản trị TikTok Downloader – Đồng bộ qua JSONBin</div>

        <div class="status-bar">
            <div class="left">
                <span class="dot offline" id="statusDot"></span>
                <span id="statusText">Đang kết nối...</span>
                <span style="opacity:0.4;">|</span>
                <span id="userCount">👥 0 user</span>
                <span style="opacity:0.4;">|</span>
                <span id="lastUpdate" style="opacity:0.4;">Chưa cập nhật</span>
                <span style="opacity:0.4;">|</span>
                <span id="msgBadge" style="background:#ff0050; color:#fff; border-radius:50%; padding:0 8px; font-size:12px; display:none;">0</span>
            </div>
            <div>
                <button id="testBtn" class="btn btn-outline btn-sm">🔍 Kiểm tra</button>
                <button id="logoutBtn" class="btn btn-outline btn-sm" style="display:none;">🚪 Đăng xuất</button>
            </div>
        </div>

        <div id="authSection" class="auth-box">
            <h3 style="color:#fff; margin-bottom:16px;">🔐 Đăng nhập quản trị</h3>
            <input type="text" id="loginUser" placeholder="Tên đăng nhập" value="admin" />
            <input type="password" id="loginPass" placeholder="Mật khẩu" value="admin123" />
            <div id="authError" class="auth-error"></div>
            <button id="loginBtn" class="btn btn-primary">Đăng nhập</button>
        </div>

        <div id="adminPanel" class="hidden">

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="users">👥 Users</button>
                <button class="tab" data-tab="compose">✉️ Gửi thư</button>
                <button class="tab" data-tab="inbox">📩 Inbox <span id="inboxBadge" style="background:#ff0050; color:#fff; border-radius:50%; padding:0 8px; font-size:11px; display:none;">0</span></button>
                <button class="tab" data-tab="sent">📤 Đã gửi</button>
            </div>

            <!-- Tab Users -->
            <div id="tab-users" class="tab-content active">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
                    <h3 style="color:#fff; font-weight:400;">👥 Danh sách người dùng</h3>
                    <div>
                        <button id="syncBtn" class="btn btn-primary btn-sm">☁️ Đồng bộ</button>
                        <button id="refreshBtn" class="btn btn-outline btn-sm">🔄 Làm mới</button>
                    </div>
                </div>
                <div id="debugInfo" class="debug-info"></div>
                <div style="overflow-x:auto;">
                    <table class="user-table" id="userTable">
                        <thead><tr><th>Tên</th><th>Role</th><th>Thao tác</th></tr></thead>
                        <tbody id="userTableBody">
                            <tr><td colspan="3" style="text-align:center;color:rgba(255,255,255,0.3);">Chưa có dữ liệu</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Tab Compose -->
            <div id="tab-compose" class="tab-content">
                <h3 style="color:#fff; font-weight:400; margin-bottom:12px;">✉️ Gửi thư mới</h3>
                <form id="composeForm" class="compose-form">
                    <select id="recipientSelect" required>
                        <option value="">-- Chọn người nhận --</option>
                    </select>
                    <textarea id="messageContent" placeholder="Nội dung tin nhắn..." required></textarea>
                    <div class="checkbox-group">
                        <input type="checkbox" id="inviteAdmin" />
                        <label for="inviteAdmin">📌 Gửi lời mời làm admin</label>
                    </div>
                    <button type="submit" class="btn btn-primary" style="align-self:flex-start;">📤 Gửi thư</button>
                </form>
                <div id="composeResult" style="margin-top:10px; color:rgba(255,255,255,0.6);"></div>
            </div>

            <!-- Tab Inbox -->
            <div id="tab-inbox" class="tab-content">
                <h3 style="color:#fff; font-weight:400; margin-bottom:12px;">📩 Hộp thư đến</h3>
                <div id="inboxList"></div>
            </div>

            <!-- Tab Sent -->
            <div id="tab-sent" class="tab-content">
                <h3 style="color:#fff; font-weight:400; margin-bottom:12px;">📤 Thư đã gửi</h3>
                <div id="sentList"></div>
            </div>

            <div class="footer-actions">
                <button id="exportBtn" class="btn btn-outline">📋 Xuất JSON</button>
                <button id="importBtn" class="btn btn-outline">📥 Nhập JSON</button>
                <button id="syncUpBtn" class="btn btn-success">☁️ Đồng bộ thủ công</button>
            </div>
        </div>

    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        //  CẤU HÌNH JSONBIN (THAY BẰNG ID VÀ KEY CỦA BẠN)
        // ============================================================
        const BIN_ID = ' 6a8d548f23a2f6593e5a08d9'; //
        const API_KEY = ' $2a$10$3QzTZojdzOP2YFcm1PkCv.ntQNzErrwdTFQ1m1CTKKV1pJxheHyim'; //
        // ============================================================

        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        const HEADERS = {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
        };

        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'admin123';

        // ============================================================
        //  QUẢN LÝ DỮ LIỆU
        // ============================================================

        const STORAGE_KEY = 'tiktok_users';
        const SESSION_KEY = 'tiktok_session';

        function getUsers() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : {};
        }

        function saveUsers(users) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
        }

        function getSession() {
            const data = localStorage.getItem(SESSION_KEY);
            return data ? JSON.parse(data) : null;
        }

        function setSession(session) {
            localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        }

        function clearSession() {
            localStorage.removeItem(SESSION_KEY);
        }

        // ---- JSONBin API ----
        let cachedRecord = null;

        async function fetchBin() {
            try {
                const res = await fetch(JSONBIN_URL, { headers: HEADERS });
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(`HTTP ${res.status}: ${errData.message || res.statusText}`);
                }
                const data = await res.json();
                cachedRecord = data.record;
                // Đảm bảo có trường messages
                if (!cachedRecord.messages) cachedRecord.messages = [];
                if (!cachedRecord.users) cachedRecord.users = {};
                return cachedRecord;
            } catch (err) {
                console.error('Lỗi đọc JSONBin:', err);
                throw err;
            }
        }

        async function updateBin(content) {
            try {
                const res = await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: HEADERS,
                    body: JSON.stringify(content)
                });
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(`HTTP ${res.status}: ${errData.message || res.statusText}`);
                }
                cachedRecord = content;
                return true;
            } catch (err) {
                console.error('Lỗi ghi JSONBin:', err);
                throw err;
            }
        }

        // ---- Hợp nhất dữ liệu ----
        function mergeUsersFromCloud(cloudUsers) {
            const local = getUsers();
            let changed = false;
            for (const [username, data] of Object.entries(cloudUsers)) {
                if (username === ADMIN_USERNAME) continue;
                if (!local[username] || local[username].role !== data.role) {
                    local[username] = data;
                    changed = true;
                }
            }
            if (changed) {
                saveUsers(local);
                return true;
            }
            return false;
        }

        // ---- Đồng bộ lên cloud ----
        async function syncToBin() {
            const users = getUsers();
            if (!users[ADMIN_USERNAME]) {
                users[ADMIN_USERNAME] = { password: ADMIN_PASSWORD, role: 'admin' };
            } else {
                users[ADMIN_USERNAME].role = 'admin';
            }
            // Lấy messages hiện tại từ cache (hoặc từ record cũ)
            const current = cachedRecord || (await fetchBin());
            const payload = {
                users: users,
                messages: current.messages || [],
                lastUpdated: Date.now()
            };
            await updateBin(payload);
            updateStatus('online', 'Đã đồng bộ ' + new Date().toLocaleTimeString());
            showToast('☁️ Đồng bộ thành công!');
        }

        // ---- Gửi thư ----
        async function sendMessage(to, content, isInvite = false) {
            const session = getSession();
            if (!session) throw new Error('Chưa đăng nhập');
            const record = await fetchBin();
            const msg = {
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                from: session.username,
                to: to,
                content: content,
                type: isInvite ? 'invite_admin' : 'normal',
                status: 'unread',
                timestamp: Date.now()
            };
            if (!record.messages) record.messages = [];
            record.messages.push(msg);
            record.lastUpdated = Date.now();
            await updateBin(record);
            return msg;
        }

        // ---- Lấy tin nhắn ----
        function getMessages(record) {
            return record.messages || [];
        }

        // ---- Đánh dấu đã đọc ----
        async function markAsRead(msgId) {
            const record = await fetchBin();
            const msg = record.messages.find(m => m.id === msgId);
            if (msg) {
                msg.status = 'read';
                await updateBin(record);
                return true;
            }
            return false;
        }

        // ============================================================
        //  POLLING
        // ============================================================

        let pollingInterval = null;

        async function pollBin() {
            try {
                const cloud = await fetchBin();
                if (!cloud || !cloud.users) {
                    updateStatus('offline', 'Dữ liệu JSONBin không hợp lệ');
                    return;
                }
                const changed = mergeUsersFromCloud(cloud.users);
                if (changed) {
                    showToast('🔄 Đã cập nhật dữ liệu user');
                    renderUsers();
                }
                // Cập nhật inbox badge
                updateInboxBadge(cloud);
                updateStatus('online', 'Đã cập nhật ' + new Date(cloud.lastUpdated).toLocaleTimeString());
                document.getElementById('lastUpdate').textContent = '🕐 ' + new Date(cloud.lastUpdated).toLocaleString();
                // Render inbox/sent nếu tab đang mở
                const activeTab = document.querySelector('.tab.active');
                if (activeTab) {
                    const tabName = activeTab.dataset.tab;
                    if (tabName === 'inbox') renderInbox(cloud);
                    else if (tabName === 'sent') renderSent(cloud);
                }
            } catch (err) {
                updateStatus('offline', 'Lỗi: ' + err.message);
                showDebug('Lỗi poll: ' + err.message);
            }
        }

        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            pollBin();
            pollingInterval = setInterval(pollBin, 5000);
        }

        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        // ============================================================
        //  UI HELPERS
        // ============================================================

        function showToast(msg, isError = false) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.background = isError ? 'rgba(200,50,50,0.9)' : 'rgba(0,0,0,0.85)';
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), 4000);
        }

        function updateStatus(status, msg) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = 'dot ' + status;
            text.textContent = msg;
        }

        function showDebug(msg) {
            const el = document.getElementById('debugInfo');
            el.textContent = msg;
            el.classList.add('show');
        }

        function hideDebug() {
            document.getElementById('debugInfo').classList.remove('show');
        }

        function updateInboxBadge(record) {
            const session = getSession();
            if (!session) return;
            const messages = getMessages(record);
            const unread = messages.filter(m => m.to === session.username && m.status === 'unread');
            const badge = document.getElementById('inboxBadge');
            const badge2 = document.getElementById('msgBadge');
            if (unread.length > 0) {
                badge.textContent = unread.length;
                badge.style.display = 'inline';
                badge2.textContent = unread.length;
                badge2.style.display = 'inline';
            } else {
                badge.style.display = 'none';
                badge2.style.display = 'none';
            }
        }

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        function renderUsers() {
            const users = getUsers();
            const tbody = document.getElementById('userTableBody');
            const entries = Object.entries(users);
            document.getElementById('userCount').textContent = '👥 ' + entries.length + ' user';

            if (entries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:rgba(255,255,255,0.3);">Chưa có dữ liệu</td></tr>';
                return;
            }

            const session = getSession();
            const currentUser = session ? session.username : '';

            tbody.innerHTML = entries.map(([username, data]) => {
                const isSelf = username === currentUser;
                const isAdmin = data.role === 'admin';
                return `
                    <tr>
                        <td>${username} ${isSelf ? '<span style="color:rgba(255,255,255,0.3);font-size:12px;">(bạn)</span>' : ''}</td>
                        <td><span class="role-badge ${isAdmin ? 'admin' : 'user'}">${isAdmin ? 'admin' : 'user'}</span></td>
                        <td class="actions-cell">
                            ${!isAdmin && !isSelf ? `<button class="btn btn-success btn-sm" onclick="promoteUser('${username}')">⬆️ Nâng</button>` : ''}
                            ${isAdmin && !isSelf ? `<button class="btn btn-warning btn-sm" onclick="demoteUser('${username}')">⬇️ Hạ</button>` : ''}
                            ${!isSelf && !isAdmin ? `<button class="btn btn-danger btn-sm" onclick="deleteUser('${username}')">🗑️ Xóa</button>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
            // Cập nhật danh sách recipient trong compose
            populateRecipients();
        }

        function populateRecipients() {
            const select = document.getElementById('recipientSelect');
            const users = getUsers();
            const session = getSession();
            const currentUser = session ? session.username : '';
            select.innerHTML = '<option value="">-- Chọn người nhận --</option>';
            for (const [username] of Object.entries(users)) {
                if (username !== currentUser && username !== ADMIN_USERNAME) {
                    select.innerHTML += `<option value="${username}">${username}</option>`;
                }
            }
        }

        function renderInbox(record) {
            const session = getSession();
            if (!session) return;
            const messages = getMessages(record);
            const inbox = messages.filter(m => m.to === session.username);
            const container = document.getElementById('inboxList');
            if (inbox.length === 0) {
                container.innerHTML = '<p style="color:rgba(255,255,255,0.3);">📭 Hộp thư trống</p>';
                return;
            }
            container.innerHTML = inbox.sort((a, b) => b.timestamp - a.timestamp).map(msg => {
                const isUnread = msg.status === 'unread';
                const isInvite = msg.type === 'invite_admin';
                const date = new Date(msg.timestamp).toLocaleString();
                return `
                    <div class="message-item ${isUnread ? 'unread' : ''}">
                        <div class="msg-header">
                            <span>Từ: <strong>${msg.from}</strong></span>
                            <span>${date}</span>
                        </div>
                        <div class="msg-content">${msg.content}</div>
                        <div class="msg-actions">
                            ${isUnread ? `<button class="btn btn-outline btn-sm" onclick="markRead('${msg.id}')">Đánh dấu đã đọc</button>` : ''}
                            ${isInvite && isUnread ? `<button class="btn btn-success btn-sm" onclick="acceptInvite('${msg.from}')">✅ Chấp nhận làm admin</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderSent(record) {
            const session = getSession();
            if (!session) return;
            const messages = getMessages(record);
            const sent = messages.filter(m => m.from === session.username);
            const container = document.getElementById('sentList');
            if (sent.length === 0) {
                container.innerHTML = '<p style="color:rgba(255,255,255,0.3);">📤 Chưa gửi thư nào</p>';
                return;
            }
            container.innerHTML = sent.sort((a, b) => b.timestamp - a.timestamp).map(msg => {
                const date = new Date(msg.timestamp).toLocaleString();
                const isInvite = msg.type === 'invite_admin';
                return `
                    <div class="message-item">
                        <div class="msg-header">
                            <span>Đến: <strong>${msg.to}</strong></span>
                            <span>${date}</span>
                        </div>
                        <div class="msg-content">${msg.content} ${isInvite ? '📌 (Lời mời admin)' : ''}</div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        //  ACTIONS
        // ============================================================

        window.promoteUser = async function(username) {
            const users = getUsers();
            if (!users[username]) return showToast('Không tìm thấy user', true);
            if (username === ADMIN_USERNAME) return showToast('Không thể nâng admin mặc định', true);
            users[username].role = 'admin';
            saveUsers(users);
            try {
                await syncToBin();
                renderUsers();
                showToast(`✅ Đã nâng ${username} thành admin`);
            } catch (err) {
                showToast('❌ Lỗi đồng bộ: ' + err.message, true);
            }
        };

        window.demoteUser = async function(username) {
            const users = getUsers();
            if (!users[username]) return showToast('Không tìm thấy user', true);
            if (username === ADMIN_USERNAME) return showToast('Không thể hạ admin mặc định', true);
            users[username].role = 'user';
            saveUsers(users);
            try {
                await syncToBin();
                renderUsers();
                showToast(`✅ Đã hạ ${username} thành user`);
            } catch (err) {
                showToast('❌ Lỗi đồng bộ: ' + err.message, true);
            }
        };

        window.deleteUser = async function(username) {
            if (username === ADMIN_USERNAME) return showToast('Không thể xóa admin mặc định', true);
            if (!confirm(`Xóa user "${username}"?`)) return;
            const users = getUsers();
            delete users[username];
            saveUsers(users);
            try {
                await syncToBin();
                renderUsers();
                showToast(`✅ Đã xóa ${username}`);
            } catch (err) {
                showToast('❌ Lỗi đồng bộ: ' + err.message, true);
            }
        };

        window.markRead = async function(msgId) {
            try {
                await markAsRead(msgId);
                showToast('✅ Đã đánh dấu đã đọc');
                const record = await fetchBin();
                updateInboxBadge(record);
                renderInbox(record);
            } catch (err) {
                showToast('❌ Lỗi: ' + err.message, true);
            }
        };

        window.acceptInvite = async function(fromUser) {
            try {
                const record = await fetchBin();
                // Cập nhật role user thành admin
                const users = getUsers();
                if (!users[fromUser]) return showToast('Không tìm thấy user', true);
                users[fromUser].role = 'admin';
                saveUsers(users);
                // Đánh dấu tất cả thư mời từ user này là đã đọc
                for (const msg of record.messages) {
                    if (msg.from === fromUser && msg.type === 'invite_admin' && msg.to === getSession().username) {
                        msg.status = 'read';
                    }
                }
                await updateBin(record);
                renderUsers();
                renderInbox(record);
                showToast(`✅ Bạn đã trở thành admin!`);
                location.reload(); // refresh để cập nhật UI
            } catch (err) {
                showToast('❌ Lỗi: ' + err.message, true);
            }
        };

        // ============================================================
        //  AUTH
        // ============================================================

        function login(username, password) {
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                setSession({ username, role: 'admin' });
                return true;
            }
            const users = getUsers();
            const user = users[username];
            if (user && user.password === password && user.role === 'admin') {
                setSession({ username, role: 'admin' });
                return true;
            }
            return false;
        }

        function logout() {
            clearSession();
            location.reload();
        }

        function showAdminPanel() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            document.getElementById('logoutBtn').style.display = 'inline-block';
            renderUsers();
            testConnection().then(() => startPolling());
        }

        function showAuth() {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('logoutBtn').style.display = 'none';
            stopPolling();
        }

        // ============================================================
        //  TEST CONNECTION
        // ============================================================

        async function testConnection() {
            try {
                showToast('⏳ Đang kiểm tra...');
                const data = await fetchBin();
                showToast('✅ Kết nối JSONBin thành công! Số user: ' + Object.keys(data.users || {}).length);
                updateStatus('online', 'Kết nối OK');
                showDebug('✅ Bin ID: ' + BIN_ID + '\nSố user: ' + Object.keys(data.users || {}).length);
                return true;
            } catch (err) {
                showToast('❌ Lỗi kết nối: ' + err.message, true);
                updateStatus('offline', 'Lỗi: ' + err.message);
                showDebug('❌ Lỗi kết nối:\n' + err.message + '\n\nKiểm tra lại:\n- Bin ID có đúng không?\n- API Key có đúng không?');
                return false;
            }
        }

        // ============================================================
        //  DOM EVENTS
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {
            const session = getSession();
            if (session && session.role === 'admin') {
                showAdminPanel();
                updateStatus('online', 'Đã đăng nhập');
            } else {
                showAuth();
                updateStatus('offline', 'Vui lòng đăng nhập');
            }

            // Login
            document.getElementById('loginBtn').addEventListener('click', () => {
                const username = document.getElementById('loginUser').value.trim();
                const password = document.getElementById('loginPass').value.trim();
                const errorEl = document.getElementById('authError');
                if (!username || !password) {
                    errorEl.textContent = 'Vui lòng nhập đầy đủ';
                    return;
                }
                if (login(username, password)) {
                    errorEl.textContent = '';
                    showAdminPanel();
                    updateStatus('online', 'Đã đăng nhập');
                } else {
                    errorEl.textContent = 'Sai tên hoặc mật khẩu';
                }
            });

            // Logout
            document.getElementById('logoutBtn').addEventListener('click', logout);

            // Tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const tabName = this.dataset.tab;
                    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                    document.getElementById('tab-' + tabName).classList.add('active');
                    // Render nội dung tương ứng
                    if (tabName === 'inbox') {
                        fetchBin().then(record => renderInbox(record));
                    } else if (tabName === 'sent') {
                        fetchBin().then(record => renderSent(record));
                    } else if (tabName === 'compose') {
                        populateRecipients();
                    }
                });
            });

            // Compose
            document.getElementById('composeForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const to = document.getElementById('recipientSelect').value;
                const content = document.getElementById('messageContent').value.trim();
                const isInvite = document.getElementById('inviteAdmin').checked;
                if (!to) { showToast('Vui lòng chọn người nhận', true); return; }
                if (!content) { showToast('Vui lòng nhập nội dung', true); return; }
                try {
                    await sendMessage(to, content, isInvite);
                    showToast('✅ Đã gửi thư thành công!');
                    document.getElementById('messageContent').value = '';
                    document.getElementById('inviteAdmin').checked = false;
                    // Cập nhật inbox badge
                    const record = await fetchBin();
                    updateInboxBadge(record);
                } catch (err) {
                    showToast('❌ Lỗi gửi: ' + err.message, true);
                }
            });

            // Sync buttons
            document.getElementById('syncBtn').addEventListener('click', async () => {
                try {
                    await syncToBin();
                    renderUsers();
                    showToast('☁️ Đồng bộ thành công!');
                } catch (err) {
                    showToast('❌ Lỗi đồng bộ: ' + err.message, true);
                }
            });
            document.getElementById('syncUpBtn').addEventListener('click', async () => {
                try {
                    await syncToBin();
                    renderUsers();
                    showToast('☁️ Đồng bộ thành công!');
                } catch (err) {
                    showToast('❌ Lỗi đồng bộ: ' + err.message, true);
                }
            });

            document.getElementById('refreshBtn').addEventListener('click', async () => {
                await pollBin();
                showToast('🔄 Đã làm mới dữ liệu');
            });

            document.getElementById('testBtn').addEventListener('click', testConnection);

            // Export
            document.getElementById('exportBtn').addEventListener('click', async () => {
                const record = await fetchBin();
                const json = JSON.stringify(record, null, 2);
                try {
                    await navigator.clipboard.writeText(json);
                    showToast('✅ Đã sao chép JSON');
                } catch {
                    const ta = document.createElement('textarea');
                    ta.value = json;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('✅ Đã sao chép (fallback)');
                }
            });

            // Import
            document.getElementById('importBtn').addEventListener('click', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    const imported = JSON.parse(text);
                    if (!imported.users || !imported.messages) throw new Error('Dữ liệu không hợp lệ');
                    const current = getUsers();
                    let count = 0;
                    for (const [username, data] of Object.entries(imported.users)) {
                        if (username === ADMIN_USERNAME) continue;
                        if (!current[username]) {
                            current[username] = data;
                            count++;
                        }
                    }
                    saveUsers(current);
                    // Cập nhật messages vào record
                    const record = await fetchBin();
                    record.messages = imported.messages || [];
                    record.users = current;
                    record.lastUpdated = Date.now();
                    await updateBin(record);
                    renderUsers();
                    showToast(`✅ Đã nhập ${count} user và đồng bộ`);
                } catch (err) {
                    showToast('❌ Lỗi nhập: ' + err.message, true);
                }
            });

            // Enter key for login
            document.getElementById('loginPass').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('loginBtn').click();
            });
            document.getElementById('loginUser').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('loginBtn').click();
            });
        });
    </script>
</body>
