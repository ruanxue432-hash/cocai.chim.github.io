<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web trung gian - Quản trị</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0b0b1a;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 950px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #ff0050;
            margin-bottom: 8px;
        }
        .sub {
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
        }
        .status-bar {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            transition: 0.3s;
        }
        .btn-primary {
            background: #ff0050;
        }
        .btn-primary:hover {
            opacity: 0.8;
        }
        .btn-success {
            background: #00c851;
        }
        .btn-success:hover {
            opacity: 0.8;
        }
        .btn-danger {
            background: #ff4444;
        }
        .btn-danger:hover {
            opacity: 0.8;
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
            margin-bottom: 10px;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: #ff0050;
        }
        select option {
            background: #1a1a2e;
        }
        .hidden {
            display: none !important;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 8px 18px;
            border-radius: 30px;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
        }
        .user-table th,
        .user-table td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .user-table th {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }
        .role-badge {
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .role-badge.admin {
            background: #f5576c;
            color: #fff;
        }
        .role-badge.user {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.6);
        }
        .message-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-left: 3px solid transparent;
        }
        .message-item.unread {
            border-left-color: #ff0050;
            background: rgba(255, 0, 80, 0.06);
        }
        .message-item .msg-header {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 4px;
        }
        .message-item .msg-content {
            color: #fff;
        }
        .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .footer-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .auth-box {
            max-width: 400px;
            margin: 40px auto;
        }
        .auth-box input {
            margin-bottom: 12px;
        }
        .secret-info {
            background: rgba(0, 255, 100, 0.05);
            border: 1px solid rgba(0, 255, 100, 0.15);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
        .secret-info strong {
            color: #69db7c;
        }
        @media (max-width: 600px) {
            .container {
                padding: 16px;
            }
            .user-table th,
            .user-table td {
                padding: 6px 8px;
                font-size: 13px;
            }
            .tabs {
                flex-wrap: wrap;
            }
            .tab {
                flex: 1;
                text-align: center;
                font-size: 13px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Web trung gian</h1>
        <div class="sub">Quản trị TikTok – Đồng bộ qua GitHub Gist</div>

        <div class="status-bar">
            <span id="statusText">🔴 Đang kết nối...</span>
            <span>
                <button id="testBtn" class="btn btn-outline btn-sm">🔍 Kiểm tra</button>
                <button id="logoutBtn" class="btn btn-outline btn-sm hidden">🚪 Đăng xuất</button>
            </span>
        </div>

        <!-- Auth -->
        <div id="authSection" class="auth-box">
            <h3 style="margin-bottom:12px;">🔐 Đăng nhập</h3>
            <input type="text" id="loginUser" placeholder="Tên" value="admin" />
            <input type="password" id="loginPass" placeholder="Mật khẩu" value="admin123" />
            <div id="authError" style="color:#ff6b6b;font-size:14px;min-height:20px;"></div>
            <button id="loginBtn" class="btn btn-primary" style="width:100%;padding:12px;">Đăng nhập</button>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="hidden">
            <div class="secret-info">
                🔑 <strong>Xác thực:</strong> Web trung gian chỉ chấp nhận dữ liệu từ web chính có cùng Secret Key.
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="users">👥 Users</button>
                <button class="tab" data-tab="compose">✉️ Gửi thư</button>
                <button class="tab" data-tab="inbox">📩 Inbox</button>
            </div>

            <!-- Tab Users -->
            <div id="tab-users" class="tab-content active">
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
                    <button id="syncBtn" class="btn btn-primary btn-sm">☁️ Đồng bộ</button>
                    <button id="refreshBtn" class="btn btn-outline btn-sm">🔄 Làm mới</button>
                </div>
                <div style="overflow-x:auto;">
                    <table class="user-table">
                        <thead><tr><th>Tên</th><th>Role</th><th>Thao tác</th></tr></thead>
                        <tbody id="userTableBody">
                            <tr><td colspan="3" style="text-align:center;color:rgba(255,255,255,0.3);">Chưa có dữ liệu</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Tab Compose -->
            <div id="tab-compose" class="tab-content">
                <h3 style="margin-bottom:10px;">✉️ Gửi thư</h3>
                <select id="recipientSelect"><option value="">-- Chọn người nhận --</option></select>
                <textarea id="messageContent" placeholder="Nội dung tin nhắn..." rows="3"></textarea>
                <label style="color:rgba(255,255,255,0.6);display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                    <input type="checkbox" id="inviteAdmin" /> 📌 Gửi lời mời làm admin
                </label>
                <button id="sendMsgBtn" class="btn btn-primary">📤 Gửi thư</button>
                <div id="composeResult" style="margin-top:8px;color:rgba(255,255,255,0.6);"></div>
            </div>

            <!-- Tab Inbox -->
            <div id="tab-inbox" class="tab-content">
                <h3 style="margin-bottom:10px;">📩 Hộp thư đến</h3>
                <div id="inboxList"></div>
            </div>

            <div class="footer-actions">
                <button id="exportBtn" class="btn btn-outline btn-sm">📋 Xuất JSON</button>
                <button id="importBtn" class="btn btn-outline btn-sm">📥 Nhập JSON</button>
                <button id="syncUpBtn" class="btn btn-success btn-sm">☁️ Đồng bộ thủ công</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        //  👇 CẤU HÌNH GITHUB GIST + SECRET KEY (THAY TOKEN CỦA BẠN)
        // ============================================================
        const GIST_ID = 'a5fc09ae4bbd3f069e2bb08a3102d5ba';
        const GITHUB_TOKEN = ' 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'; // ← Dán token vào đây
        const SECRET_KEY = 'mySuperSecretKey123'; // ← Đổi thành key bí mật của bạn
        // ============================================================

        const GIST_URL = `https://api.github.com/gists/${GIST_ID}`;
        const HEADERS = {
            'Authorization': `Bearer ${GITHUB_TOKEN}`,
            'Accept': 'application/json'
        };

        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'admin123';

        // ---- Storage ----
        const USERS_KEY = 'tiktok_users';
        const SESSION_KEY = 'tiktok_session';

        function getUsers() {
            const data = localStorage.getItem(USERS_KEY);
            return data ? JSON.parse(data) : {};
        }

        function saveUsers(users) {
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        function getSession() {
            const data = localStorage.getItem(SESSION_KEY);
            return data ? JSON.parse(data) : null;
        }

        function setSession(s) {
            localStorage.setItem(SESSION_KEY, JSON.stringify(s));
        }

        function clearSession() {
            localStorage.removeItem(SESSION_KEY);
        }

        // ---- Gist API ----
        async function fetchGist() {
            const res = await fetch(GIST_URL, { headers: HEADERS });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(`HTTP ${res.status}: ${err.message || res.statusText}`);
            }
            const data = await res.json();
            const content = data.files['data.json'].content;
            return JSON.parse(content);
        }

        async function updateGist(content) {
            const payload = {
                files: {
                    'data.json': {
                        content: JSON.stringify(content, null, 2)
                    }
                }
            };
            const res = await fetch(GIST_URL, {
                method: 'PATCH',
                headers: { ...HEADERS, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(`HTTP ${res.status}: ${err.message || res.statusText}`);
            }
            return true;
        }

        // ---- Đồng bộ (có kiểm tra secret) ----
        let cachedData = null;

        async function syncToGist() {
            const users = getUsers();
            if (!users[ADMIN_USERNAME]) {
                users[ADMIN_USERNAME] = { password: ADMIN_PASSWORD, role: 'admin' };
            } else {
                users[ADMIN_USERNAME].role = 'admin';
            }
            const payload = {
                users: users,
                messages: cachedData?.messages || [],
                lastUpdated: Date.now(),
                _secret: SECRET_KEY // ✅ Gửi kèm secret để xác thực
            };
            await updateGist(payload);
            cachedData = payload;
            showToast('☁️ Đồng bộ thành công!');
            updateStatus('🟢 Đã đồng bộ ' + new Date().toLocaleTimeString());
        }

        async function fetchAndMerge() {
            try {
                const data = await fetchGist();
                
                // ✅ KIỂM TRA SECRET: Nếu không khớp -> từ chối dữ liệu
                if (data._secret !== SECRET_KEY) {
                    console.warn('⚠️ Dữ liệu không được xác thực (sai secret)');
                    showToast('⚠️ Dữ liệu từ web chính không xác thực!', true);
                    updateStatus('🔴 Lỗi xác thực: sai secret');
                    return null;
                }

                cachedData = data;
                if (!data.users) data.users = {};
                if (!data.messages) data.messages = [];

                const localUsers = getUsers();
                let changed = false;
                for (const [username, info] of Object.entries(data.users)) {
                    if (username === ADMIN_USERNAME) continue;
                    if (!localUsers[username] || localUsers[username].role !== info.role) {
                        localUsers[username] = info;
                        changed = true;
                    }
                }
                if (changed) {
                    saveUsers(localUsers);
                    showToast('🔄 Đã cập nhật dữ liệu user');
                }
                renderUsers();
                updateStatus('🟢 Cập nhật lúc ' + new Date().toLocaleTimeString());
                return data;
            } catch (err) {
                updateStatus('🔴 Lỗi: ' + err.message);
                showToast('❌ ' + err.message, true);
                return null;
            }
        }

        // ---- Render ----
        function renderUsers() {
            const users = getUsers();
            const tbody = document.getElementById('userTableBody');
            const entries = Object.entries(users);
            if (entries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:rgba(255,255,255,0.3);">Chưa có dữ liệu</td></tr>';
                return;
            }
            const session = getSession();
            const currentUser = session ? session.username : '';
            tbody.innerHTML = entries.map(([username, data]) => {
                const isSelf = username === currentUser;
                const isAdmin = data.role === 'admin';
                return `
                    <tr>
                        <td>${username} ${isSelf ? '👤' : ''}</td>
                        <td><span class="role-badge ${isAdmin ? 'admin' : 'user'}">${isAdmin ? 'admin' : 'user'}</span></td>
                        <td class="actions-cell">
                            ${!isAdmin && !isSelf ? `<button class="btn btn-success btn-sm" onclick="promoteUser('${username}')">⬆️ Nâng</button>` : ''}
                            ${isAdmin && !isSelf ? `<button class="btn btn-danger btn-sm" onclick="demoteUser('${username}')">⬇️ Hạ</button>` : ''}
                            ${!isSelf ? `<button class="btn btn-danger btn-sm" onclick="deleteUser('${username}')">🗑️</button>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
            populateRecipients();
        }

        function populateRecipients() {
            const select = document.getElementById('recipientSelect');
            const users = getUsers();
            const session = getSession();
            const currentUser = session ? session.username : '';
            select.innerHTML = '<option value="">-- Chọn người nhận --</option>';
            for (const [name] of Object.entries(users)) {
                if (name !== currentUser && name !== ADMIN_USERNAME) {
                    select.innerHTML += `<option value="${name}">${name}</option>`;
                }
            }
        }

        function renderInbox() {
            const session = getSession();
            if (!session || !cachedData) return;
            const msgs = cachedData.messages.filter(m => m.to === session.username);
            const container = document.getElementById('inboxList');
            if (msgs.length === 0) {
                container.innerHTML = '<p style="color:rgba(255,255,255,0.3);">📭 Hộp thư trống</p>';
                return;
            }
            container.innerHTML = msgs.sort((a, b) => b.timestamp - a.timestamp).map(msg => {
                const isUnread = msg.status === 'unread';
                const isInvite = msg.type === 'invite_admin';
                const date = new Date(msg.timestamp).toLocaleString();
                return `
                    <div class="message-item ${isUnread ? 'unread' : ''}">
                        <div class="msg-header"><span>Từ: <strong>${msg.from}</strong></span><span>${date}</span></div>
                        <div class="msg-content">${msg.content}</div>
                        <div style="margin-top:6px;display:flex;gap:8px;">
                            ${isUnread ? `<button class="btn btn-outline btn-sm" onclick="markRead('${msg.id}')">📖 Đã đọc</button>` : ''}
                            ${isInvite && isUnread ? `<button class="btn btn-success btn-sm" onclick="acceptInvite('${msg.from}')">✅ Chấp nhận admin</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ---- Actions ----
        window.promoteUser = async function(username) {
            const users = getUsers();
            if (!users[username]) return showToast('Không tìm thấy user', true);
            users[username].role = 'admin';
            saveUsers(users);
            await syncToGist();
            renderUsers();
            showToast(`✅ Đã nâng ${username} thành admin`);
        };

        window.demoteUser = async function(username) {
            const users = getUsers();
            if (!users[username]) return showToast('Không tìm thấy user', true);
            users[username].role = 'user';
            saveUsers(users);
            await syncToGist();
            renderUsers();
            showToast(`✅ Đã hạ ${username} thành user`);
        };

        window.deleteUser = async function(username) {
            if (username === ADMIN_USERNAME) return showToast('Không thể xóa admin', true);
            if (!confirm(`Xóa "${username}"?`)) return;
            const users = getUsers();
            delete users[username];
            saveUsers(users);
            await syncToGist();
            renderUsers();
            showToast(`✅ Đã xóa ${username}`);
        };

        window.markRead = async function(msgId) {
            if (!cachedData) return;
            const msg = cachedData.messages.find(m => m.id === msgId);
            if (msg) {
                msg.status = 'read';
                await updateGist(cachedData);
                renderInbox();
                showToast('✅ Đã đánh dấu đã đọc');
            }
        };

        window.acceptInvite = async function(fromUser) {
            try {
                const users = getUsers();
                if (!users[fromUser]) return showToast('Không tìm thấy user', true);
                users[fromUser].role = 'admin';
                saveUsers(users);
                for (const msg of cachedData.messages) {
                    if (msg.from === fromUser && msg.type === 'invite_admin' && msg.to === getSession().username) {
                        msg.status = 'read';
                    }
                }
                await updateGist(cachedData);
                showToast(`✅ Bạn đã trở thành admin!`);
                renderUsers();
                renderInbox();
                setTimeout(() => location.reload(), 1000);
            } catch (err) {
                showToast('❌ ' + err.message, true);
            }
        };

        // ---- Gửi thư ----
        document.getElementById('sendMsgBtn').addEventListener('click', async function() {
            const to = document.getElementById('recipientSelect').value;
            const content = document.getElementById('messageContent').value.trim();
            const isInvite = document.getElementById('inviteAdmin').checked;
            if (!to) return showToast('Chọn người nhận', true);
            if (!content) return showToast('Nhập nội dung', true);
            const session = getSession();
            if (!session) return showToast('Chưa đăng nhập', true);
            try {
                const data = await fetchGist();
                if (!data.messages) data.messages = [];
                data.messages.push({
                    id: Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    from: session.username,
                    to: to,
                    content: content,
                    type: isInvite ? 'invite_admin' : 'normal',
                    status: 'unread',
                    timestamp: Date.now()
                });
                data.lastUpdated = Date.now();
                data._secret = SECRET_KEY; // ✅ Gửi kèm secret
                await updateGist(data);
                cachedData = data;
                showToast('✅ Đã gửi thư!');
                document.getElementById('messageContent').value = '';
                document.getElementById('inviteAdmin').checked = false;
                renderInbox();
            } catch (err) {
                showToast('❌ ' + err.message, true);
            }
        });

        // ---- Auth ----
        function login(username, password) {
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                setSession({ username, role: 'admin' });
                return true;
            }
            const users = getUsers();
            const user = users[username];
            if (user && user.password === password && user.role === 'admin') {
                setSession({ username, role: 'admin' });
                return true;
            }
            return false;
        }

        function logout() {
            clearSession();
            location.reload();
        }

        function showAdminPanel() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            renderUsers();
            fetchAndMerge().then(() => {
                renderInbox();
                startPolling();
            });
        }

        // ---- Polling ----
        let pollInterval = null;

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                await fetchAndMerge();
                renderInbox();
            }, 5000);
        }

        function updateStatus(msg) {
            document.getElementById('statusText').textContent = msg;
        }

        // ---- Toast ----
        function showToast(msg, isError = false) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.background = isError ? 'rgba(200,50,50,0.9)' : 'rgba(0,0,0,0.85)';
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), 3000);
        }

        // ---- Test connection ----
        async function testConnection() {
            try {
                const data = await fetchGist();
                if (data._secret !== SECRET_KEY) {
                    showToast('⚠️ Dữ liệu không xác thực! Secret không khớp.', true);
                    return false;
                }
                showToast('✅ Kết nối Gist thành công! Dữ liệu hợp lệ.');
                updateStatus('🟢 Kết nối OK');
                return true;
            } catch (err) {
                showToast('❌ Lỗi: ' + err.message, true);
                updateStatus('🔴 Lỗi: ' + err.message);
                return false;
            }
        }

        // ---- DOM Events ----
        document.addEventListener('DOMContentLoaded', function() {
            const session = getSession();
            if (session && session.role === 'admin') {
                showAdminPanel();
                updateStatus('🟢 Đã đăng nhập');
            } else {
                updateStatus('🔴 Vui lòng đăng nhập');
            }

            // Login
            document.getElementById('loginBtn').addEventListener('click', function() {
                const username = document.getElementById('loginUser').value.trim();
                const password = document.getElementById('loginPass').value.trim();
                const errEl = document.getElementById('authError');
                if (!username || !password) {
                    errEl.textContent = 'Vui lòng nhập đầy đủ';
                    return;
                }
                if (login(username, password)) {
                    errEl.textContent = '';
                    showAdminPanel();
                    updateStatus('🟢 Đã đăng nhập');
                } else {
                    errEl.textContent = 'Sai tên hoặc mật khẩu';
                }
            });

            // Logout
            document.getElementById('logoutBtn').addEventListener('click', logout);

            // Tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const target = this.dataset.tab;
                    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                    document.getElementById('tab-' + target).classList.add('active');
                    if (target === 'inbox') renderInbox();
                });
            });

            // Sync
            document.getElementById('syncBtn').addEventListener('click', async () => {
                await syncToGist();
                renderUsers();
            });
            document.getElementById('syncUpBtn').addEventListener('click', async () => {
                await syncToGist();
                renderUsers();
            });
            document.getElementById('refreshBtn').addEventListener('click', async () => {
                await fetchAndMerge();
                renderInbox();
                showToast('🔄 Đã làm mới');
            });
            document.getElementById('testBtn').addEventListener('click', testConnection);

            // Export/Import
            document.getElementById('exportBtn').addEventListener('click', async () => {
                const data = await fetchGist();
                const json = JSON.stringify(data, null, 2);
                try {
                    await navigator.clipboard.writeText(json);
                    showToast('✅ Đã sao chép JSON');
                } catch {
                    const ta = document.createElement('textarea');
                    ta.value = json;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('✅ Đã sao chép (fallback)');
                }
            });

            document.getElementById('importBtn').addEventListener('click', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    const imported = JSON.parse(text);
                    if (!imported.users || !imported.messages) throw new Error('Invalid');
                    // Kiểm tra secret khi import
                    if (imported._secret !== SECRET_KEY) {
                        showToast('⚠️ Dữ liệu không xác thực! Secret không khớp.', true);
                        return;
                    }
                    const current = getUsers();
                    let count = 0;
                    for (const [name, info] of Object.entries(imported.users)) {
                        if (name === ADMIN_USERNAME) continue;
                        if (!current[name]) { current[name] = info;
                            count++; }
                    }
                    saveUsers(current);
                    await syncToGist();
                    renderUsers();
                    showToast(`✅ Đã nhập ${count} user`);
                } catch (err) {
                    showToast('❌ Lỗi: ' + err.message, true);
                }
            });

            // Enter key
            document.getElementById('loginPass').addEventListener('keydown', e => {
                if (e.key === 'Enter') document.getElementById('loginBtn').click();
            });
        });
    </script>
</body>
    </html>
