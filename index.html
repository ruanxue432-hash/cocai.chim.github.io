<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Offset Dumper & Search Tool</title>
    <style>
        * { box-sizing: border-box; font-family: monospace; }
        body { background: #121212; color: #00ff66; padding: 15px; margin: 0; }
        h2 { text-align: center; color: #fff; text-shadow: 0 0 10px #00ff66; }
        .box { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        input[type="file"], input[type="text"] { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button { background: #00ff66; color: #000; font-weight: bold; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 5px; }
        button:hover { background: #00cc52; }
        .stats { font-size: 12px; color: #aaa; margin-top: 5px; }
        #output { width: 100%; height: 350px; background: #080808; color: #00ff66; border: 1px solid #333; padding: 10px; font-size: 11px; overflow-y: scroll; white-space: pre-wrap; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>FF OFFSET DUMPER & SEARCH</h2>

    <div class="box">
        <label style="color:#fff;">1. Chọn tệp Lib (.so) hoặc Metadata (.dat):</label>
        <input type="file" id="fileInput" accept=".so,.dat,.json,.txt">
        <button onclick="processFile()">Tải & Phân Tích Tệp</button>
        <div id="fileInfo" class="stats">Chưa có tệp nào được nạp.</div>
    </div>

    <div class="box">
        <label style="color:#fff;">2. Tìm kiếm Offset (Ví dụ: Head, Recoil, Player):</label>
        <input type="text" id="searchInput" oninput="filterOffsets()" placeholder="Nhập từ khóa cần tìm...">
        <div id="searchStats" class="stats">Đã tìm thấy: 0 kết quả</div>
    </div>

    <div class="box">
        <label style="color:#fff;">3. Kết quả Offset:</label>
        <div id="output">// Hãy nạp file để bắt đầu xuất dữ liệu Offset...</div>
        <button onclick="exportFile()" style="margin-top: 10px; background: #00bcd4;">Xuất Tệp Offset (.txt)</button>
    </div>

    <script>
        let rawData = [];
        let filteredData = [];

        function processFile() {
            const file = document.getElementById('fileInput').files[0];
            const fileInfo = document.getElementById('fileInfo');
            const output = document.getElementById('output');

            if (!file) {
                alert("Vui lòng chọn một tệp!");
                return;
            }

            fileInfo.innerText = `Đang đọc: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)...`;
            output.innerText = "Đang quét danh sách Offset, vui lòng đợi trong giây lát...";

            const reader = new FileReader();
            
            // Xử lý đọc file text/JSON hoặc binary đơn giản
            reader.onload = function(e) {
                const text = e.target.result;
                
                // Mô phỏng đọc chuỗi/Regex để trích xuất hàm và Offset từ file dump
                const lineRegex = /(?:([a-zA-Z0-9_]+)\s*[:=]\s*(0x[0-9a-fA-F]+))|(?:Offset:\s*(0x[0-9a-fA-F]+)\s*->\s*([a-zA-Z0-9_]+))/g;
                let match;
                rawData = [];

                // Giả lập quét cấu trúc chuỗi Hex Offset
                const lines = text.split('\n');
                lines.forEach((line, index) => {
                    if (line.includes('0x') || line.includes('Offset') || line.includes('Get') || line.includes('Set')) {
                        rawData.push(`[Line ${index + 1}] ${line.trim()}`);
                    }
                });

                if (rawData.length === 0) {
                    output.innerText = "Không tìm thấy cấu trúc Offset dạng Hex chuẩn. Vui lòng nạp file script.json hoặc file .txt đã dump qua Il2CppDumper.";
                    fileInfo.innerText = "Phân tích thất bại - Không tìm thấy mẫu Offset.";
                    return;
                }

                fileInfo.innerText = `Hoàn tất! Tổng số Offset quét được: ${rawData.length}`;
                filteredData = [...rawData];
                renderOutput();
            };

            reader.readAsText(file);
        }

        function renderOutput() {
            const output = document.getElementById('output');
            const searchStats = document.getElementById('searchStats');
            
            searchStats.innerText = `Hiển thị: ${filteredData.length} / ${rawData.length} kết quả`;
            output.innerText = filteredData.join('\n');
        }

        function filterOffsets() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) {
                filteredData = [...rawData];
            } else {
                filteredData = rawData.filter(item => item.toLowerCase().includes(query));
            }
            renderOutput();
        }

        function exportFile() {
            if (filteredData.length === 0) {
                alert("Không có dữ liệu Offset để xuất!");
                return;
            }

            const blob = new Blob([filteredData.join('\n')], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'FF_Offsets_Export.txt';
            link.click();
        }
    </script>
</body>
</html>
