<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Web khịa</title>
    <style>
        body {
            background: #0d0d0d;
            text-align: center;
            padding-top: 50px;
            font-family: Arial;
            color: #fff;
        }
        h1 {
            font-size: 60px;
            color: #ff4757;
            text-shadow: 0 0 20px #ff4757;
        }
        .box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            display: inline-block;
            border: 2px solid #ff4757;
        }
        .khia {
            color: #ffa502;
            font-size: 28px;
        }
        .ten {
            color: #2ed573;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🤡 KHỊA MÀY NÈ</h1>
        <p class="khia">"Mày tưởng mày ngầu lắm hả?"</p>
        <p class="khia">"Tự ban acc mình là hay nhất đấy 😂"</p>
        <p class="khia">"Xàm vừa thôi, thằng <span class="ten">@duyunknow</span>!"</p>
        <p>---</p>
        <p style="color:#888;">(Trang web tự động khịa, không bảo hành 🤣)</p>
    </div>
</body>
</html>
